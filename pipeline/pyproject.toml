[project]
name = "gitstars"
version = "0.1.0"
description = "Offline pipeline that turns GitHub stars into a 3D galaxy export."
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx[http2]>=0.28",
  "pydantic>=2.9",
  "typer>=0.15",
  "rich>=13.9",
  "tenacity>=9.0",
  "aiolimiter>=1.2",
  "trafilatura>=2.0",
  "markdown-it-py>=3.0",
  "pathspec>=0.12",
  "numpy>=2.1",
  "scikit-learn>=1.6",
  "umap-learn>=0.5.7",
  "jsonschema[format-nongpl]>=4.23",
  "sentence-transformers>=6.1",
  "transformers>=5.18",
  "torch",
  "pillow>=13.0.0",
  "torchvision>=0.29.1",
]

[project.scripts]
gs = "gitstars.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitstars"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["F", "E9", "B", "I"]
ignore = ["B905"]
